name: Bug report
description: Report a reproducible simulation, content, persistence, tooling, or client defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
      description: What happened in the world or tooling?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: What observable result did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include seed, commands/actions, relevant save state, and the smallest reliable sequence.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or branch.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Domain or simulation
        - Scenario or quest content
        - Persistence or replay
        - Stride client or UX
        - Headless runner or tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, replay details, or test output. Remove credentials and personal data.

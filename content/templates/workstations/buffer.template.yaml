template_schema_version: 1
template_id: template.workstation.restaurant.fifo-buffer
template_version: 1

parameters:
  workstation-slug: token
  capacity: positive_integer

content: |
  schema_version: 1
  industries:
    - id: industry.restaurant
      display_name: Restaurant
  items:
    - id: item.restaurant.dish
      industry: industry.restaurant
      display_name: Dish
      states: [scraped, racked]
  workstations:
    - id: workstation.restaurant.{{parameter:workstation-slug}}
      industry: industry.restaurant
      display_name: FIFO Rack Buffer
      accepted_items: [item.restaurant.dish]
      input_state: scraped
      output_state: racked
      presentation: presentation.workstation.rack.standard
      presentation_fallback: presentation.fallback.workstation
      buffer:
        capacity: {{parameter:capacity}}
        ordering: fifo

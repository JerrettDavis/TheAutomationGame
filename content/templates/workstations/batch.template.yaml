template_schema_version: 1
template_id: template.workstation.restaurant.batch-washer
template_version: 1

parameters:
  workstation-slug: token
  cycle-ticks: positive_integer

content: |
  schema_version: 1
  industries:
    - id: industry.restaurant
      display_name: Restaurant
  items:
    - id: item.restaurant.dish
      industry: industry.restaurant
      display_name: Dish
      states: [racked, washed_in_machine]
  workstations:
    - id: workstation.restaurant.{{parameter:workstation-slug}}
      industry: industry.restaurant
      display_name: Batch Washer
      accepted_items: [item.restaurant.dish]
      input_state: racked
      output_state: washed_in_machine
      presentation: presentation.workstation.dish-washer.standard
      presentation_fallback: presentation.fallback.workstation
      batch:
        capacity: 1
        cycle_ticks: {{parameter:cycle-ticks}}

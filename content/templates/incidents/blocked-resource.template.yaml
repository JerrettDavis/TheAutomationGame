template_schema_version: 1
template_id: template.incident.restaurant.blocked-resource
template_version: 1
parameters:
  incident-slug: token
  duration-ticks: positive_integer
variants:
  trigger-tick:
    kind: non_negative_integer
    options: [1, 2, 3]
content: |
  schema_version: 1
  industries:
    - id: industry.restaurant
      display_name: Restaurant
  incidents:
    - id: incident.restaurant.{{parameter:incident-slug}}
      industry: industry.restaurant
      display_name: Washer Unavailable
      trigger_at_tick: {{variant:trigger-tick}}
      scope: dish-station
      observable: The washer cannot accept a new batch.
      evidence: Start requests are rejected while the washer resource is blocked.
      recovery: The washer becomes available for new batches.
      blocked_resource:
        duration_ticks: {{parameter:duration-ticks}}
        resource: washer

template_schema_version: 1
template_id: template.incident.restaurant.worker-absence
template_version: 1
parameters:
  incident-slug: token
  duration-ticks: positive_integer
variants:
  trigger-tick:
    kind: non_negative_integer
    options: [1, 2, 3]
content: |
  schema_version: 1
  industries:
    - id: industry.restaurant
      display_name: Restaurant
  incidents:
    - id: incident.restaurant.{{parameter:incident-slug}}
      industry: industry.restaurant
      display_name: New Hire Absent
      trigger_at_tick: {{variant:trigger-tick}}
      scope: dish-station
      observable: Delegated work stops while the worker is absent.
      evidence: The worker action count remains unchanged during the absence window.
      recovery: The configured worker resumes delegated work.
      worker_absence:
        duration_ticks: {{parameter:duration-ticks}}
        worker: new-hire
